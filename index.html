<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B Ξ N Λ V · FPV</title>
    <style>
        :root {
            --bg-main: #09090b;
            --bg-surface: #121216;
            --border-subtle: #23232b;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            line-height: 1.6;
        }

        /* Barra superior fija */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: rgba(9, 9, 11, 0.88);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-subtle);
        }

        .topbar-inner {
            position: relative;
            max-width: 1140px;
            margin: 0 auto;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* Botón de 3 rallitas */
        .menu-btn {
            width: 42px;
            height: 42px;
            background: transparent;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .menu-btn:hover {
            border-color: var(--accent);
            background-color: var(--bg-surface);
        }

        .menu-btn span {
            display: block;
            width: 18px;
            height: 2px;
            background-color: var(--accent);
            border-radius: 2px;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        /* Animación de las 3 líneas al abrir (se convierten en X) */
        .menu-btn.abierto span:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }

        .menu-btn.abierto span:nth-child(2) {
            opacity: 0;
        }

        .menu-btn.abierto span:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }

        /* Nombre al lado del botón */
        .marca {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.14em;
            white-space: nowrap;
        }

        /* Menú flotante compacto debajo del botón (no ocupa todo el ancho) */
        .menu-desplegable {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 20px;
            width: 220px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.55);
            z-index: 120;
        }

        .menu-desplegable.activo {
            display: block;
        }

        .menu-lista {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .menu-lista a {
            display: block;
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.92rem;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        .menu-lista a:hover {
            background-color: #1c1c24;
            transform: translateX(3px);
        }

        /* Segmentos de referencia para probar la navegación */
        .segmento {
            max-width: 1140px;
            margin: 0 auto;
            padding: 90px 20px;
            border-bottom: 1px solid var(--border-subtle);
            scroll-margin-top: 76px;
        }

        .segmento h2 {
            font-size: 1.6rem;
            margin-bottom: 8px;
        }

        .segmento p {
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header class="topbar">
        <div class="topbar-inner">
            <button class="menu-btn" id="btnMenu" aria-label="Abrir menú" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <a href="#inicio" class="marca">B Ξ N Λ V · FPV</a>

            <nav class="menu-desplegable" id="menuDesplegable" aria-label="Navegación principal">
                <div class="menu-lista">
                    <a href="#inicio">Inicio</a>
                    <a href="#servicios">Servicios</a>
                    <a href="#portafolio">Portafolio</a>
                    <a href="#contacto">Contacto</a>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <section class="segmento" id="inicio">
            <h2>Inicio</h2>
            <p>Segmento inicial listo para diseñar tu banner.</p>
        </section>

        <section class="segmento" id="servicios">
            <h2>Servicios</h2>
            <p>Aquí integraremos los 3 cuadros en seguidilla.</p>
        </section>

        <section class="segmento" id="portafolio">
            <h2>Portafolio</h2>
            <p>Espacio reservado para tus muestras de vuelo y videos.</p>
        </section>

        <section class="segmento" id="contacto" style="border-bottom: none;">
            <h2>Contacto</h2>
            <p>Espacio para cotizaciones y redes.</p>
        </section>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const btnMenu = document.querySelector("#btnMenu");
            const menuDesplegable = document.querySelector("#menuDesplegable");
            const enlacesMenu = menuDesplegable.querySelectorAll("a");

            function cerrarMenu() {
                menuDesplegable.classList.remove("activo");
                btnMenu.classList.remove("abierto");
                btnMenu.setAttribute("aria-expanded", "false");
            }

            btnMenu.addEventListener("click", (e) => {
                e.stopPropagation();
                const estaAbierto = menuDesplegable.classList.toggle("activo");
                btnMenu.classList.toggle("abierto", estaAbierto);
                btnMenu.setAttribute("aria-expanded", estaAbierto);
            });

            // Cierra el menú al elegir un segmento
            enlacesMenu.forEach(enlace => {
                enlace.addEventListener("click", cerrarMenu);
            });

            // Cierra el menú si haces clic fuera de él
            document.addEventListener("click", (e) => {
                if (!menuDesplegable.contains(e.target) && !btnMenu.contains(e.target)) {
                    cerrarMenu();
                }
            });
        });
    </script>

</body>
</html>
